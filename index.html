  <style> /* score + combo (ui/score.js): total top right, the multiplier, its 2 s window, the pot; points popping over the kills */
    #score, #pops { --ol: -2px -2px #1a0a10, 0 -2px #1a0a10, 2px -2px #1a0a10, -2px 0 #1a0a10, 2px 0 #1a0a10, -2px 2px #1a0a10, 0 2px #1a0a10, 2px 2px #1a0a10; }
    #score { position: absolute; right: 26px; top: 14px; text-align: right; color: #ffd890; }
    #scoreN { display: inline-block; font-size: 44px; line-height: 1; letter-spacing: 1px; transform-origin: 100% 60%; text-shadow: var(--ol), 4px 4px 0 #7a0812, 6px 6px 0 #1a0a10; }
    #scoreN.up { color: #fff0c8; transform: scale(1.12); }
    #scoreN.zero { visibility: hidden; }
    #combo { display: none; --heat: #ffd890; }
    #combo.on { display: block; }
    #comboRow { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 4px; }
    #comboBump { display: inline-block; transform-origin: 70% 70%; }
    #comboX { display: inline-block; font-size: 84px; line-height: 0.9; font-style: italic; letter-spacing: -3px; padding-right: 10px; color: var(--heat);
      text-shadow: -3px -3px #1a0a10, 0 -3px #1a0a10, 3px -3px #1a0a10, -3px 0 #1a0a10, 3px 0 #1a0a10, -3px 3px #1a0a10, 0 3px #1a0a10, 3px 3px #1a0a10,
        6px 6px 0 #7a0812, 8px 8px 0 #5a0a10, 10px 10px 0 #1a0a10; animation: comboThrob 0.55s ease-in-out infinite; }
    #comboMax { display: none; padding: 4px 9px 3px; font-size: 18px; letter-spacing: 2px; color: #ffe8b0; background: #9a0016; box-shadow: 3px 3px 0 #1a0a10; transform: skewX(-12deg); }
    #combo.max #comboX { font-size: 100px; animation: comboShake 0.1s steps(1) infinite; }
    #combo.max #comboMax { display: inline-block; animation: comboBlink 0.3s steps(1) infinite; }
    #combo.hit #comboX { color: #5a0a10; text-shadow: -3px -3px #ffd890, 3px -3px #ffd890, -3px 3px #ffd890, 3px 3px #ffd890, 0 -3px #ffd890, 0 3px #ffd890, 8px 8px 0 #1a0a10; }

    #comboFill { height: 100%; background: var(--heat); transform-origin: 100% 50%; }
    #combo.low #comboFill { animation: comboLow 0.16s steps(1) infinite; }
    #comboPot { display: block; margin-top: 10px; font-size: 26px; line-height: 1; font-style: normal; color: #ffe8b0; text-shadow: var(--ol), 3px 3px 0 #7a0812, 5px 5px 0 #1a0a10; }
    #comboFly { position: absolute; right: 0; top: 0; opacity: 0; font-size: 30px; line-height: 1; font-style: normal; color: #fff0c8; transform-origin: 100% 50%;
      text-shadow: var(--ol), 3px 3px 0 #7a0812, 5px 5px 0 #1a0a10; }
    #comboFly.burn { color: #9a0016; text-decoration: line-through; text-shadow: var(--ol); }
    @keyframes comboThrob { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) scale(1.07); } }
    @keyframes comboLow { 50% { background: #5a0a10; } }
    @keyframes comboShake { 0% { transform: translate(2px, -2px) rotate(-2deg); } 25% { transform: translate(-3px, 1px) rotate(1deg); }
      50% { transform: translate(1px, 2px) rotate(2deg); } 75% { transform: translate(-1px, -3px) rotate(-1deg); } }
    @keyframes comboBlink { 50% { background: #ffd890; color: #5a0a10; } }
    #pops { position: absolute; inset: 0; overflow: hidden; }
    .pop { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; text-align: center; }
    .pop b { display: block; font-size: 26px; line-height: 1; color: #ffd890; text-shadow: var(--ol), 3px 3px 0 #7a0812, 5px 5px 0 #1a0a10; }
    .pop i { display: inline-block; margin-top: 6px; padding: 3px 8px 2px; font-size: 15px; font-style: normal; letter-spacing: 1px; color: #ffe8b0; background: #9a0016; box-shadow: 3px 3px 0 #1a0a10; transform: skewX(-12deg); }
    .pop i:empty { display: none; }
    .pop.t2 b { font-size: 34px; color: #ffc050; }
    .pop.t3 b { font-size: 44px; color: #ff8c3c; }
    .pop.t4 b { font-size: 58px; color: #ff4632; }
    .pop.t3 i, .pop.t4 i { font-size: 18px; }
    .pop.cut b { font-size: 19px; color: #e8d8b0; }
  </style>

    /* the end, Hotline Miami style: stripes rolling behind, the title shaking in two colours, the stats sliding in and counting up,

    #end { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden;
      background: repeating-linear-gradient(-30deg, rgba(90,0,14,0.9) 0 40px, rgba(40,0,8,0.94) 40px 80px); background-size: 160px 160px; animation: endRoll 6s linear infinite;
      color: #e8dcc8; font: 700 18px ui-monospace, Menlo, monospace; cursor: pointer; text-align: center; }

    @keyframes endShake { 0% { transform: skewX(-8deg) translate(0, 0); } 33% { transform: skewX(-8deg) translate(2px, -1px); } 66% { transform: skewX(-8deg) translate(-2px, 1px); } }
    #end .name { margin: 0 0 4px; color: #ffd890; letter-spacing: 4px; }
    #end .rows p { margin: 2px 0; display: flex; gap: 40px; justify-content: space-between; min-width: 400px; padding: 2px 12px; background: rgba(10,0,4,0.55); opacity: 0; animation: endRow 0.3s ease-out forwards; }
    @keyframes endRow { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
    #end .rows i { font-style: normal; color: #c8b0d0; }
    #end .rows b { color: #fff0c8; }
    #end .grade { font-size: 190px; line-height: 1; color: #ffd890; text-shadow: -6px 0 #ff2a5a, 6px 0 #2ad8ff, 10px 10px 0 #1a0a10; opacity: 0; animation: endStamp 0.35s cubic-bezier(.2,1.6,.4,1) forwards; }

    #end .missed { margin-top: 6px; opacity: 0; animation: endRow 0.4s ease-out forwards; }

    #end .hint { margin: 8px 0 0; color: #a88a9a; font-style: italic; font-size: 15px; }
    #end .credit { font-size: 11px; color: #8a7a9a; font-weight: 400; margin-top: 8px; }
    #end .again { margin-top: 10px; color: #c8b8d8; font-size: 14px; animation: dread 1.4s ease-in-out infinite; }
    #plaque { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity 0.7s; }
